name: Deploy gallery store

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-store
  cancel-in-progress: false

env:
  # !!! Zmień w każdym magazynie (Gallery3 -> kittylensoj-gallery3)
  PROJECT_NAME: kittylensoj-gallery2

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache miniatur
        uses: actions/cache@v4
        with:
          path: .thumbcache
          key: thumbs-${{ github.run_id }}
          restore-keys: thumbs-

      - name: Instalacja
        run: npm install --no-audit --no-fund

      - name: Miniatury + index.json
        run: node scripts/build-store.mjs

      - name: Utwórz projekt Pages (tylko za pierwszym razem)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch=main || true

      - name: Wdrożenie magazynu
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT_NAME" --branch main --commit-dirty=true

      - name: Przebuduj stronę główną
        env:
          MAIN_DEPLOY_HOOK: ${{ secrets.MAIN_DEPLOY_HOOK }}
        run: |
          if [ -n "$MAIN_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$MAIN_DEPLOY_HOOK"
          else
            echo "Brak sekretu MAIN_DEPLOY_HOOK - pomijam przebudowę strony głównej."
          fi
